<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기출 찾아보기</title>
<style>
:root{--navy:#1E2353;--ink:#1B1F3B;--muted:#5B6280;--paper:#F3F5FB;--card:#fff;--line:#D9DEEE;--blue:#5865F2;--pink:#EC48BD;--green:#17B26A;--warn:#FFF2CC}
*{box-sizing:border-box}
body{margin:0;font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:19px;margin:0 8px 0 0;white-space:nowrap}
header .sub{font-size:12px;color:#C9D3EE}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1}
select,input[type=search]{font:inherit;font-size:14px;padding:6px 9px;border-radius:8px;border:1px solid #4a5196;background:#fff;color:var(--ink);max-width:100%}
input[type=search]{min-width:200px;flex:1}
button{font:inherit;cursor:pointer}
.reset{background:transparent;color:#C9D3EE;border:1px solid #4a5196;border-radius:8px;padding:6px 10px;font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;padding:16px 20px;align-items:start}
.stat{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:#E4E8FB;color:var(--navy);white-space:nowrap}
.chip.dark{background:var(--navy);color:#fff}.chip.warn{background:var(--warn);color:#7a5b00}.chip.ok{background:#DCF5E7;color:#0b6b3a}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 150px)}
.item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:#F7F8FD}.item.on{background:#E9ECFE}
.item .t{font-weight:700;font-size:14px}.item .m{font-size:12px;color:var(--muted)}
.group{padding:6px 12px;background:#EEF1FA;font-size:12px;font-weight:700;color:var(--blue);position:sticky;top:0}
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-height:300px}
.detail h2{font-size:21px;margin:8px 0 12px}
.sec{margin-top:18px}.sec h3{font-size:14px;margin:0 0 8px;color:var(--blue)}
.qimg{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.qimg img{max-width:min(100%,560px);border:1px solid var(--line);border-radius:6px}
.answer{background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;font-weight:700;font-size:16px}
.answer.hide{color:transparent;background:#C9D3EE;user-select:none;cursor:pointer;position:relative}
.answer.hide::after{content:"눌러서 정답 보기";color:var(--navy);position:absolute;left:16px;top:12px;font-weight:700}
.sol p,.theory p{margin:6px 0}.theory .h{font-weight:700;color:var(--navy);margin-top:12px}
.theory img{max-width:min(100%,520px);display:block;margin:8px 0 2px;border:1px solid var(--line);border-radius:6px}
.cap{font-size:12px;color:var(--muted)}
.psg{margin-top:8px}.psg img{max-width:min(100%,520px);border:1px solid var(--line);border-radius:6px;display:block;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:#EEF1FA;font-size:12px;white-space:nowrap}
.note{background:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.empty{color:var(--muted);padding:40px 10px;text-align:center}
.toggle{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--navy)}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.list{max-height:40vh}}
@media print{header,.list,.stat,.toggle{display:none}.wrap{display:block;padding:0}.detail{border:0}}
#lock{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#lock form{background:#fff;border-radius:14px;padding:26px 24px;width:min(380px,100%);display:grid;gap:12px}
#lock h2{margin:0;font-size:20px;color:var(--navy)}#lock p{margin:0;font-size:13px;color:var(--muted)}
#lock input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
#lock button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700}
#lock .err{color:#C0392B;font-size:13px;min-height:1em}#lock label{font-size:13px;color:var(--muted)}
</style></head><body>
<header>
  <div><h1>기출 찾아보기</h1><div class="sub" id="sub"></div></div>
  <div class="filters">
    <select id="f-year"></select><select id="f-area"></select><select id="f-unit"></select>
    <select id="f-type"></select><select id="f-strength"></select>
    <select id="f-sort"><option value="recent">최근 학년도순</option><option value="unit">단원순</option><option value="points">배점 높은 순</option></select>
    <input type="search" id="f-q" placeholder="낱말로 찾기 (예: 오페론, 순환학습, Ran)">
    <button class="reset" id="reset">조건 지우기</button>
  </div>
</header>
<div class="wrap">
  <div class="stat" id="stat"></div>
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">왼쪽에서 문항을 고르세요.</div></div>
</div>
<div id="lock"><form id="lockf"><h2>기출 찾아보기</h2>
<p>스터디원 전용 자료입니다. 공유받은 비밀번호를 입력하세요.</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" required>
<label><input type="checkbox" id="remember"> 이 기기에서 비밀번호 기억하기</label>
<button>열기</button><div class="err" id="err"></div></form></div>
<script>
function app(DATA) {
const Q = DATA.questions, $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
let hideAnswer = true, current = null;
document.getElementById("sub").textContent = DATA.title + " · " + Q.length + "문항";
function options(el, label, values) {
  el.innerHTML = `<option value="">${label} 전체</option>` + values.map(v => `<option>${esc(v)}</option>`).join("");
}
const uniq = a => [...new Set(a.filter(x => x !== "" && x != null))];
options($("f-year"), "학년도", uniq(Q.map(q => q.year)).sort((a, b) => b - a));
options($("f-area"), "영역", uniq(Q.map(q => q.area)).sort());
options($("f-type"), "유형", uniq(Q.map(q => q.type)));
options($("f-strength"), "근거", ["직접", "부분", "배경", "근거 없음"]);
$("f-unit").innerHTML = `<option value="">단원 전체</option>` + DATA.parts.map(p =>
  `<optgroup label="${esc(p.part)}"><option value="P:${esc(p.part)}">${esc(p.part)} 전체</option>` +
  p.units.map(u => `<option value="U:${esc(u.id)}">${esc(u.chapter)}</option>`).join("") + `</optgroup>`).join("");
function filtered() {
  const y = $("f-year").value, a = $("f-area").value, u = $("f-unit").value, t = $("f-type").value,
        s = $("f-strength").value, words = $("f-q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let out = Q.filter(q => (!y || String(q.year) === y) && (!a || q.area === a) && (!t || q.type === t) &&
    (!s || q.strength === s) && (!u || (u[0] === "P" ? q.part === u.slice(2) : q.unit === u.slice(2))) &&
    words.every(w => q.hay.includes(w)));
  const sort = $("f-sort").value;
  if (sort === "recent") out.sort((p, q) => q.year - p.year || p.order - q.order);
  else if (sort === "unit") out.sort((p, q) => p.unitOrder - q.unitOrder || q.year - p.year || p.order - q.order);
  else out.sort((p, q) => q.points - p.points || q.year - p.year || p.order - q.order);
  return out;
}
function render() {
  const rows = filtered(), sort = $("f-sort").value;
  const pts = rows.reduce((n, q) => n + (q.points || 0), 0);
  const areas = {}; rows.forEach(q => areas[q.area] = (areas[q.area] || 0) + 1);
  $("stat").innerHTML = `<span class="chip dark">${rows.length}문항 · ${pts}점</span>` +
    Object.entries(areas).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span class="chip">${esc(k)} ${v}</span>`).join("") +
    `<button class="toggle" id="tg">${hideAnswer ? "정답 가리는 중 (눌러서 항상 보기)" : "정답 보이는 중 (눌러서 가리기)"}</button>`;
  $("tg").onclick = () => { hideAnswer = !hideAnswer; render(); if (current) show(current); };
  let html = "", last = null;
  rows.forEach(q => {
    const g = sort === "unit" ? q.part + " › " + q.chapter : q.year + "학년도";
    if (g !== last && sort !== "points") { html += `<div class="group">${esc(g)}</div>`; last = g; }
    html += `<div class="item${current === q.id ? " on" : ""}" data-id="${esc(q.id)}"><div class="t">${esc(q.topic)}</div>` +
      `<div class="m">${esc(q.title)} · ${esc(q.type)} ${q.points}점 · ${esc(sort === "unit" ? q.area : q.chapter)}</div></div>`;
  });
  $("list").innerHTML = html || `<div class="empty">조건에 맞는 문항이 없습니다.</div>`;
  $("list").querySelectorAll(".item").forEach(el => el.onclick = () => { current = el.dataset.id; render(); show(current); });
}
function blocks(list) {
  return list.map(b => typeof b === "string"
    ? b.split("\n").map(t => t.startsWith("<") ? `<p class="h">${esc(t.replace(/^<|>$/g, ""))}</p>` : `<p>${rich(t)}</p>`).join("")
    : `<img data-src="${esc(b.figure)}" alt=""><div class="cap">${esc(b.caption || "")}</div>`).join("");
}
function show(id) {
  const q = Q.find(x => x.id === id); if (!q) return;
  const sc = q.strength === "직접" ? "ok" : "warn";
  $("detail").innerHTML =
    `<span class="chip dark">${esc(q.title)}</span> <span class="chip">${esc(q.type)} · ${q.points}점</span> ` +
    `<span class="chip">${esc(q.part)} › ${esc(q.chapter)}</span> <span class="chip ${sc}">근거 ${esc(q.strength)}</span>` +
    (q.confidence ? ` <span class="chip ${q.confidence === "높음" ? "ok" : "warn"}">신뢰도 ${esc(q.confidence)}</span>` : "") +
    `<h2>${esc(q.topic)}</h2>` +
    `<div class="sec"><h3>문제</h3><div class="qimg">${q.images.map(i => `<img data-src="${esc(i)}" alt="문제">`).join("") || esc(q.summary)}</div></div>` +
    `<div class="sec"><h3>정답 (예시)</h3><div class="answer${hideAnswer ? " hide" : ""}" id="ans">${esc(q.answer)}</div></div>` +
    `<div class="sec sol" id="sol" ${hideAnswer ? "hidden" : ""}><h3>문제해결과정</h3>${blocks([q.solution])}</div>` +
    `<div class="sec theory"><h3>관련 이론정리</h3>${blocks(q.theory)}</div>` +
    `<div class="sec"><h3>관련 참고 문헌</h3><table><tr><th>책</th><th>쪽</th><th>근거</th><th>그 쪽의 내용</th></tr>` +
      q.refs.map(r => `<tr><td>${esc(r.book)}</td><td>p.${esc(r.pages)}</td><td>${esc(r.strength)}</td><td>${esc(r.evidence)}${r.passages.length ? `<div class="psg"><div class="cap">교재 원문 (빨간 밑줄이 근거 문장)</div>${r.passages.map(p => `<img data-src="${esc(p)}" alt="교재 원문">`).join("")}</div>` : ""}</td></tr>`).join("") + `</table></div>` +
    (q.supplement.length ? `<div class="sec"><h3>개론서에 없는 용어</h3><table><tr><th>용어</th><th>다른 책</th><th>메모</th></tr>` +
      q.supplement.map(x => `<tr><td><b>${esc(x.term)}</b></td><td>${esc(x.where || "없음")}</td><td>${esc(x.note)}</td></tr>`).join("") + `</table></div>` : "") +
    (q.note ? `<div class="sec note">${esc(q.note)}</div>` : "") +
    `<div class="sec cap">예시 답안은 개론서를 근거로 작성한 것이며 공식 정답이 아닙니다.</div>`;
  hydrate($("detail"));
  const ans = $("ans");
  ans.onclick = () => { ans.classList.remove("hide"); $("sol").hidden = false; };
  window.scrollTo({top: 0});
}
["f-year", "f-area", "f-unit", "f-type", "f-strength", "f-sort"].forEach(id => $(id).onchange = render);
$("f-q").oninput = render;
$("reset").onclick = () => { document.querySelectorAll("select").forEach(s => s.selectedIndex = 0); $("f-q").value = ""; render(); };
render();
}
function hydrate(root) {
  root.querySelectorAll("img[data-src]").forEach(async im => {
    const p = im.dataset.src; im.removeAttribute("data-src");
    try { im.src = window.IMG ? await window.IMG(p) : p; } catch (e) { im.alt = "그림을 열지 못했습니다"; }
  });
}
(async () => {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const meta = await (await fetch("meta.json", {cache: "no-store"})).json();
  const slot = "imyong-key-" + meta.salt;
  let key = null;
  const derive = async pw => {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(meta.salt), iterations: meta.iter, hash: "SHA-256"},
      base, {name: "AES-CBC", length: 256}, true, ["decrypt"]);
  };
  const dec = buf => { const u = new Uint8Array(buf); return crypto.subtle.decrypt({name: "AES-CBC", iv: u.slice(0, 16)}, key, u.slice(16)); };
  const check = async () => new TextDecoder().decode(await dec(b64(meta.check))) === "imyong-ok";
  const cache = {};
  window.IMG = async p => cache[p] || (cache[p] = URL.createObjectURL(new Blob(
    [await dec(await (await fetch(p + ".enc")).arrayBuffer())], {type: p.endsWith(".png") ? "image/png" : "image/jpeg"})));
  const open = async () => {
    const data = JSON.parse(new TextDecoder().decode(await dec(await (await fetch("data.enc", {cache: "no-store"})).arrayBuffer())));
    document.getElementById("lock").remove(); app(data);
  };
  try {
    const saved = localStorage.getItem(slot);
    if (saved) { key = await crypto.subtle.importKey("raw", b64(saved), "AES-CBC", true, ["decrypt"]); if (await check()) return open(); }
  } catch (e) {}
  key = null;
  document.getElementById("lockf").onsubmit = async ev => {
    ev.preventDefault(); const err = document.getElementById("err"); err.textContent = "여는 중…";
    try { key = await derive(document.getElementById("pw").value); if (!(await check())) throw 0; }
    catch (e) { key = null; err.textContent = "비밀번호가 맞지 않습니다."; return; }
    if (document.getElementById("remember").checked) {
      try { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key)); localStorage.setItem(slot, btoa(String.fromCharCode(...raw))); } catch (e) {}
    }
    try { await open(); } catch (e) { err.textContent = "자료를 불러오지 못했습니다. 새로고침해 보세요."; }
  };
})();
</script></body></html>
